name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # CPU-only torch keeps CI fast; GPU tests (-m gpu) run on GPU machines only.
      - name: Install dependencies
        run: uv sync --locked --extra cpu

      - name: Environment info
        run: uv run python scripts/env_info.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests (non-GPU)
        run: uv run pytest -m "not gpu"
